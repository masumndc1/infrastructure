---
- hosts: lap-freebsd:localhost
  become: true
  gather_facts: true

  tasks:
    - name: Ensure cloud image ISO directory exists
      ansible.builtin.file:
        path: "{{ vm_dir }}/.iso"
        state: directory
        mode: '0755'
      when: ansible_os_family == "FreeBSD"

    - name: Check if VM is already running
      ansible.builtin.command:
        cmd: "vm list"
      register: vm_list
      changed_when: false
      when: ansible_os_family == "FreeBSD"

    - name: create vm
      ansible.builtin.command:
        cmd: "vm create -c {{ vm_cpus }} -m {{ vm_ram }} -s {{ vm_size }} {{ vm_name }}"
        creates: "{{ vm_dir }}/{{ vm_name }}/disk0.img"
      when:
        - ansible_os_family == "FreeBSD"
        - vm_name not in vm_list.stdout

    - name: stop vm before we place the config
      ansible.builtin.command:
        cmd: "vm stop {{ vm_name }}"
      changed_when: false
      when: ansible_os_family == "FreeBSD"

    - name: place vm conf file
      ansible.builtin.template:
        src: ../template/vm_config.j2
        dest: "{{ vm_dir }}/{{ vm_name }}/{{ vm_name }}.conf"
        mode: '0644'
      changed_when: false
      when: ansible_os_family == "FreeBSD"

    - name: vm install
      ansible.builtin.command:
        cmd: "vm install {{ vm_name }} {{ iso_name }}"
      changed_when: false
      when:
        - ansible_os_family == "FreeBSD"

    - name: Manually run VM
      ansible.builtin.debug:
        msg: "now run: sudo vm start vm_name"
      when: ansible_os_family == "FreeBSD"
