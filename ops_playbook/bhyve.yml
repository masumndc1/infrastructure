---
- hosts: lap-freebsd:localhost
  become: true
  gather_facts: true

  tasks:
    - name: Ensure cloud image ISO directory exists
      ansible.builtin.file:
        path: "{{ vm_dir }}/.iso"
        state: directory
        mode: '0755'
      when: ansible_os_family == "FreeBSD"

    - name: list switch
      ansible.builtin.command:
        cmd: "vm switch list"
      register: vm_switch
      changed_when: false
      when: ansible_os_family == "FreeBSD"

    - name: create public switch
      ansible.builtin.command:
        cmd: "vm switch create public"
      register: vm_switch
      changed_when: false
      when: ("public not in vm_switch.stdout") and
        ansible_os_family == "FreeBSD"

    - name: add wlan0 to public switch
      ansible.builtin.command:
        cmd: "vm switch add public {{ vm_int }}"
      register: vm_switch_int
      changed_when: false
      when: ("{{ vm_int }} not in vm_switch.stdout") and
        ansible_os_family == "FreeBSD"

    - name: list isos
      ansible.builtin.command:
        cmd: "vm iso"
      register: vm_iso
      changed_when: false
      when: ansible_os_family == "FreeBSD"

    - name: get the iso
      ansible.builtin.command:
        cmd: "vm iso {{ iso_url }}"
      changed_when: false
      when: ("{{ iso_name }} not in vm_iso.stdout") and
         ansible_os_family == "FreeBSD"

    - name: vm install
      ansible.builtin.command:
        cmd: "vm install {{ vm_name }} {{ iso_name }}"
      register: vm_list
      changed_when: false
      when: ("{{ vm_name }} not in vm_list.stdout") and
         ansible_os_family == "FreeBSD"

    - name: Render vm-bhyve configuration
      ansible.builtin.template:
        src: ../template/vm_config.j2
        dest: "{{ vm_dir }}/{{ vm_name }}/{{ vm_name }}.conf"
        mode: '0644'
      when: ansible_os_family == "FreeBSD"

    - name: Check if VM is already running
      ansible.builtin.command:
        cmd: "vm list"
      register: vm_list
      changed_when: false
      when: ansible_os_family == "FreeBSD"

    - name: Start VM with cloud-init seed configuration
      ansible.builtin.command:
        cmd: "vm start {{ vm_name }}"
      when: ("vm_name not in vm_list.stdout") and
        ansible_os_family == "FreeBSD"
